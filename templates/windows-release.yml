# Optional workflow template: copy to .github/workflows/ to enable in your repository.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '**.py'
      - 'static/**'
      - '*requirements*.txt'
      - 'ResourceAnalyzer.spec'
      - 'version_info.txt'
      - 'build.ps1'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: '*requirements*.txt'
      - name: Build standalone Windows executable
        shell: pwsh
        run: ./build.ps1
      - name: Record checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ResourceAnalyzer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ResourceAnalyzer.exe" | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ResourceAnalyzer-Windows-x64
          path: |
            dist/ResourceAnalyzer.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ResourceAnalyzer-Windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/ResourceAnalyzer.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/ResourceAnalyzer.exe dist/SHA256SUMS.txt --title "자원 분석기 $RELEASE_TAG" --generate-notes --verify-tag
          fi
